# 本地开发依赖：PostgreSQL + Redis（与 .env.example 默认值对应）
services:
  postgres:
    image: postgres:16-alpine
    container_name: eatwise-postgres
    environment:
      POSTGRES_USER: eatwise
      POSTGRES_PASSWORD: eatwise
      POSTGRES_DB: eatwise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eatwise']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eatwise-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
