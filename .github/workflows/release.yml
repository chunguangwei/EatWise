# EatWise 发版流水线
# 触发：打 v* 标签（如 git tag v1.0.0 && git push origin v1.0.0）。
# 产物：Android APK（release 构建，签名=CI secret KEYSTORE_BASE64 里的
# debug.keystore，与本地开发机同源，保证覆盖安装一致）附到 GitHub Release。
# 注意：正式发布上架需换正式 keystore（见 TODO）；iOS 分发需 Apple
# Developer 证书与 App Store Connect，本流水线暂不产出 iOS 包。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-apk:
    name: 构建 APK 并发布 GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eatwise_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史 tag 生成更新日志

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: pub get + 代码生成
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      # 签名一致性：release 构建默认回落 debug 签名（Flutter 模板
      # signingConfigs.debug），把本仓库 secret 里的 debug.keystore（与本地
      # 开发机同一把）写到 runner 默认路径，CI 产物才能覆盖安装本地装的版本。
      # TODO(发布): 上架前换正式 keystore（CI secrets: KEYSTORE_BASE64 换正式
      # 库），届时老用户需卸载重装或走应用商店签名。
      - name: 写入签名 keystore（与本地开发机同源）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # 自检：打出文件摘要与证书指纹，与本地开发机比对防签名漂移
          # （debug key 指纹非敏感信息）。本地基线见复工手册。
          sha256sum "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -i "SHA256:"

      # API_BASE_URL 取仓库 Actions 变量（Settings → Secrets and variables →
      # Actions → Variables），未配置时回退为 localhost（仅模拟器可用）。
      # CI_KEYSTORE_PATH 让 build.gradle.kts 走显式 ciRelease 签名——runner
      # 上 debug 默认 keystore 查找不可靠（v1.12.2/v1.12.3 两次签名漂移实锤），
      # 显式路径 + 构建后指纹断言双保险。
      - name: 构建 APK（release；签名=上面的 keystore）
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:3000/v1' }}
          CI_KEYSTORE_PATH: /home/runner/.android/debug.keystore
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      # 产物签名指纹断言：与本机 debug key 基线（79:94:78:99…B1:95，debug
      # 证书指纹非敏感）不一致直接失败，绝不再放出签名漂移的包。
      - name: 校验 APK 签名指纹（防签名漂移）
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT"
          echo "$CERT" | grep -q "79947899336324f5977ea90ad5fc296df6b51bba1071e536ed58510cf712b195"

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "eatwise-${TAG}.apk"
          # 更新日志取上一 tag 以来的提交标题（客户端更新弹窗直接展示该
          # 文本，--generate-notes 只会产出一条 Full Changelog 链接）。
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$TAG"; else RANGE="$TAG"; fi
          {
            echo "## 更新内容"
            echo
            git log --pretty=format:'- %s' "$RANGE" | grep -vE '^- chore: v[0-9]' || echo '- 稳定性改进与问题修复'
          } > release-notes.md
          gh release create "$TAG" "eatwise-${TAG}.apk" \
            --title "EatWise $TAG" \
            --notes-file release-notes.md \
            --latest
