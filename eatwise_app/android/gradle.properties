org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
# 工程路径含中文目录（个人文件），JVM 默认 file.encoding 非 UTF-8 时
# flutter-plugin-loader 解析 SDK 路径会乱码导致 included build 找不到，必须强制 UTF-8。
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
